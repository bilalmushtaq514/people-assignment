name: CI/CD Pipeline

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_prod_deploy:
        description: "Type 'yes' to confirm production deployment"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # -----------------------------------------------------------
  # Job 1: Lint and Test (runs on every push and PR)
  # -----------------------------------------------------------
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run flake8 linter
        run: flake8 app/ --max-line-length=120 --exclude=__pycache__

      - name: Run pytest
        run: pytest app/tests/ -v --tb=short

  # -----------------------------------------------------------
  # Job 2: Build and Push Docker Image
  # Runs on push to dev/staging, or manual dispatch for prod.
  # Skipped for main (CI-only) and pull requests.
  # -----------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/dev' ||
        github.ref == 'refs/heads/staging')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirm_prod_deploy == 'yes')
    environment: >-
      ${{
        github.event_name == 'workflow_dispatch' && 'prod' ||
        (github.ref == 'refs/heads/dev' && 'dev') ||
        (github.ref == 'refs/heads/staging' && 'staging')
      }}

    outputs:
      image_tag: ${{ github.sha }}
      environment: >-
        ${{
          github.event_name == 'workflow_dispatch' && 'prod' ||
          (github.ref == 'refs/heads/dev' && 'dev') ||
          (github.ref == 'refs/heads/staging' && 'staging')
        }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                       -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
                       app/
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  # -----------------------------------------------------------
  # Job 3: Deploy to Environment
  # Uses GitHub Environments for per-env secrets and protection.
  # The prod environment should have a required-reviewer rule.
  # -----------------------------------------------------------
  deploy:
    name: Deploy to ${{ needs.build-and-push.outputs.environment }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ needs.build-and-push.outputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to ECS
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager

      - name: Wait for service stability
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          echo "Waiting for ECS service to reach steady state..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"
          echo "Deployment complete and service is stable."
